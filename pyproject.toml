[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aroi"
version = "1.0.0"
description = "African Research Opportunity Intelligence — turns new African research into ranked, evidence-backed business opportunities"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.21",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "jinja2>=3.1",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aroi = "aroi.cli:main"

[tool.setuptools]
packages = ["aroi", "aroi.stages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
