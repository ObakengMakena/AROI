name: Weekly digest

on:
  schedule:
    - cron: "41 4 * * 1"   # Mondays 06:41 South Africa time (after the daily run)
  workflow_dispatch:

concurrency:
  group: aroi-pipeline
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      DIGEST_TO: ${{ secrets.DIGEST_TO }}
      SECTORS: ${{ vars.SECTORS }}
      MONTHLY_BUDGET_USD: ${{ vars.MONTHLY_BUDGET_USD || '45' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - run: python -m aroi digest
      - uses: actions/upload-artifact@v4
        with:
          name: digest
          path: out/*.html
          retention-days: 90
