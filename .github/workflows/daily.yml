name: Daily research pipeline

on:
  schedule:
    - cron: "17 3 * * *"   # 05:17 South Africa time, every day (cron is UTC)
  workflow_dispatch:
    inputs:
      only:
        description: "Run only these stages (space separated), e.g. 'discover triage'. Leave empty for all."
        required: false
        default: ""

concurrency:
  group: aroi-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MONTHLY_BUDGET_USD: ${{ vars.MONTHLY_BUDGET_USD || '20' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Run pipeline
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then
            python -m aroi daily --only $ONLY
          else
            python -m aroi daily
          fi
      - name: Status
        if: always()
        run: python -m aroi status
